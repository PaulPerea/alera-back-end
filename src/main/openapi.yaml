openapi: 3.0.3
info:
  title: Books API
  description: API para gestión de libros
  version: 1.0.0
  contact:
    name: API Support
    email: support@example.com

servers:
  - url: http://localhost:8080
    description: Servidor de desarrollo

tags:
  - name: Books
    description: Operaciones relacionadas con libros

paths:
  /api/v1/books:
    post:
      tags:
        - Books
      summary: Crear un nuevo libro
      description: Registra un nuevo libro en el sistema
      operationId: createBook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookRequest'
      responses:
        '201':
          description: Libro creado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookResponse'
        '400':
          description: Datos de entrada inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    BookRequest:
      type: object
      required:
        - title
        - author
        - isbn
        - price
      properties:
        title:
          type: string
          description: Título del libro
          example: Clean Code
          minLength: 1
          maxLength: 255
        author:
          type: string
          description: Autor del libro
          example: Robert C. Martin
          minLength: 1
          maxLength: 255
        isbn:
          type: string
          description: Código ISBN del libro
          example: "978-0132350884"
          pattern: '^(?:ISBN(?:-1[03])?:? )?(?=[0-9X]{10}$|(?=(?:[0-9]+[- ]){3})[- 0-9X]{13}$|97[89][0-9]{10}$|(?=(?:[0-9]+[- ]){4})[- 0-9]{17}$)(?:97[89][- ]?)?[0-9]{1,5}[- ]?[0-9]+[- ]?[0-9]+[- ]?[0-9X]$'
        price:
          type: number
          format: double
          description: Precio del libro
          example: 45.99
          minimum: 0.01

    BookResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: ID único del libro
          example: 123e4567-e89b-12d3-a456-426614174000
        title:
          type: string
          description: Título del libro
          example: Clean Code
        author:
          type: string
          description: Autor del libro
          example: Robert C. Martin
        isbn:
          type: string
          description: Código ISBN del libro
          example: "978-0132350884"
        price:
          type: number
          format: double
          description: Precio del libro
          example: 45.99
        createdAt:
          type: string
          format: date-time
          description: Fecha de creación del libro
          example: "2024-12-06T10:30:00Z"

    ErrorResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
          description: Momento en que ocurrió el error
          example: "2024-12-06T10:30:00Z"
        status:
          type: integer
          description: Código de estado HTTP
          example: 400
        error:
          type: string
          description: Tipo de error
          example: Bad Request
        message:
          type: string
          description: Mensaje descriptivo del error
          example: El campo título es obligatorio
        path:
          type: string
          description: Ruta del endpoint donde ocurrió el error
          example: /api/v1/books